[project]
name = "deepmd-torchsim"
version = "0.1.0"
description = "DeePMD-kit (PyTorch backend) ModelInterface implementation for torch-sim"
readme = "README.md"
authors = [{ email = "umraorahul07@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch-sim-atomistic>=0.6.1",
    "torch>=2",
    "numpy",
    "ase>=3.26",
]

[project.optional-dependencies]
deepmd = ["deepmd-kit==3.1.3", "torch==2.10.0", "mpich", "e3nn"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
filterwarnings = [
    # deepmd-kit loads its frozen model via torch.jit.load internally; these
    # deprecation warnings are from deepmd-kit's own code, not ours.
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning",
    "ignore:`torch.jit.script_method` is deprecated.*:DeprecationWarning",
    "ignore:`torch.jit.load` is deprecated.*:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepmd_torchsim*"]

[tool.setuptools.package-data]
# Small (~10 MB) example CH4 model, shipped so tutorials/examples can run
# end-to-end without requiring a user-provided trained model.
deepmd_torchsim = ["data/*.pth"]

[tool.ruff]
target-version = "py312"
line-length = 90
output-format = "concise"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN401",
    "COM812",
    "CPY001",
    "D205",
    "EM101",
    "EM102",
    "PLR0913",
    "PLR2004",
    "TD",
    "FIX002",
    "TRY003",
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# PTH1xx (prefer pathlib.Path) is intentionally ignored here: tests use os.path
# on purpose.
"**/tests/*" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "D",
    "INP001",
    "PTH100",
    "PTH110",
    "PTH118",
    "PTH120",
    "PTH123",
    "S101",
    "T201",
]
